name: Build

on:
  push:
    branches:
      - main
    paths: &build_paths
      - "src/**"
      - "app/**"
      - "tests/**"
      - "cmake/**"
      - "resources/**"          # copied next to the debugger at build time
      - "CMakeLists.txt"
      - "tools/run_goldens.py"
      - "tools/check_coverage.py"
      - "docs/spec.md"          # its compile-time checks, for the coverage gate
      - ".github/workflows/build.yaml"
  pull_request:
    paths: *build_paths
  workflow_dispatch:            # run by hand from the Actions tab

permissions:
  contents: read

defaults:
  run:
    shell: pwsh

# Cancel superseded runs of the same branch/PR instead of paying for both.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.os }} (${{ matrix.Configuration }})
    # macOS minutes bill at 10x, Windows at 2x (private repos), so cap them tightly.
    timeout-minutes: ${{ matrix.os == 'macos-latest' && 60 || 30 }}
    strategy:
      fail-fast: false
      matrix:
        # macOS only on manual runs (and on tags, via release.yml): it bills at 10x.
        os: ${{ fromJSON(github.event_name == 'workflow_dispatch' && '["windows-latest","ubuntu-latest","macos-latest"]' || '["windows-latest","ubuntu-latest"]') }}
        Configuration: ["Debug", "Release"]
        exclude:
          # When run by hand, Release alone covers macOS.
          - os: macos-latest
            Configuration: Debug
    runs-on: ${{ matrix.os }}
    env:
      # Visual Studio is multi-config (build/app/Debug/...); Makefiles are single-config (build/app/...).
      OUT_SUBDIR: ${{ matrix.os == 'windows-latest' && format('/{0}', matrix.Configuration) || '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          lfs: true

      # SDL3 only enables the video backends whose headers it finds; the debugger needs X11/Wayland.
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends `
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev `
            libxss-dev libxtst-dev libxkbcommon-dev libwayland-dev libdecor-0-dev `
            libegl1-mesa-dev libgl1-mesa-dev libgles2-mesa-dev libdrm-dev libgbm-dev `
            libasound2-dev libpulse-dev libdbus-1-dev libudev-dev

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # SDL3 and FreeType dominate build time; ccache reuses their objects between runs.
      # (Skipped on Windows: the Visual Studio generator ignores compiler launchers.)
      - name: Set up ccache
        if: runner.os != 'Windows'
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ matrix.os }}-${{ matrix.Configuration }}
          max-size: 500M

      - name: Use ccache
        if: runner.os != 'Windows'
        run: |
          foreach ($l in 'C','CXX','OBJC','OBJCXX') { "CMAKE_${l}_COMPILER_LAUNCHER=ccache" >> $env:GITHUB_ENV }

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ matrix.Configuration }}

      - name: Build (${{ matrix.Configuration }})
        run: cmake --build build --config ${{ matrix.Configuration }} --parallel

      - name: Unit tests
        run: ./build/tests${{ env.OUT_SUBDIR }}/ls_tests

      - name: Test version command
        run: |
          $output = & "./build/app${{ env.OUT_SUBDIR }}/levelscript" --version
          Write-Host "Version output: $output"
          if ($output -notmatch '^levelscript \d+\.\d+\.\d+$') {
            Write-Error "Unexpected version output: '$output'"
            exit 1
          }

      # Golden-output determinism gate (tests/golden/ vs .expected). Running it on every
      # platform is what proves the output really is a pure function of (seed, params).
      - name: Goldens
        run: python tools/run_goldens.py

      # Every compile-time check of the spec (section 7.3) has a negative test:
      # a `// check N` tag in tests/, or a tests/errors header naming it.
      - name: Check coverage
        run: python tools/check_coverage.py
