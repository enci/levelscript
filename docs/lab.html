<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LevelScript Lab</title>
  <meta name="description" content="Write a LevelScript program in your browser, run it, and look up the language.">
  <meta name="robots" content="noindex">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" type="image/png" href="img/levelscript.png">
</head>
<body class="lab">
  <div class="container">
    <header class="lab-head">
      <img src="img/levelscript.png" alt="LevelScript logo">
      <h1>LevelScript</h1>
      <div class="sandbox-bar">
        <select id="sb-sample" aria-label="Load a sample"><option value="">load a sample&hellip;</option></select>
        <button type="button" id="sb-reset" title="Back to the default sample"><i class="fas fa-rotate-left"></i> Reset</button>
        <button type="button" id="sb-prev" title="Bring back the draft that was replaced last" disabled><i class="fas fa-clock-rotate-left"></i> Restore previous</button>
        <button type="button" id="sb-download"><i class="fas fa-download"></i> Download .lvs</button>
        <label class="file-btn"><i class="fas fa-folder-open"></i> Open .lvs<input type="file" id="sb-open" accept=".lvs,text/plain" hidden></label>
        <span id="sb-note" role="status"></span>
      </div>
    </header>
    <main class="lab-main">
      <div id="sandbox" data-height="640" data-diag-under-editor></div>
      <section id="reference">
        <h2>Reference</h2>
        <input type="search" id="ref-q" placeholder="search: random, path, grow, ..." aria-label="Search the reference" autocomplete="off">
        <div class="layer-chips" id="ref-kinds"></div>
        <div id="ref-results"></div>
      </section>
    </main>
  </div>
  <script src="wasm/ls_wasm.js"></script>
  <script src="js/samples-data.js"></script>
  <script src="js/api-search.js"></script>
  <script src="js/editor-model.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
