<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LevelScript Lab</title>
  <meta name="description" content="Write a LevelScript program in your browser, run it, and look up the language.">
  <meta name="robots" content="noindex">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/theme.js"></script>
  <link rel="icon" type="image/png" href="img/levelscript.png">
</head>
<body class="lab">
  <div class="container">
    <header class="lab-head">
      <img src="img/levelscript.png" alt="LevelScript logo">
      <h1>LevelScript</h1>
      <span class="lab-badge" title="The LevelScript lab: write, run and keep scripts in your browser"><i class="fas fa-flask"></i> lab</span>
      <div class="sandbox-bar">
        <div class="sb-group" role="group" aria-label="Your script">
          <span class="sb-label"><i class="fas fa-file-code"></i> script</span>
          <select id="sb-script" aria-label="Your scripts" title="Your scripts, kept in this browser"></select>
          <button type="button" id="sb-new" title="Start a new script"><i class="fas fa-plus"></i> New</button>
          <button type="button" id="sb-rename" title="Rename this script"><i class="fas fa-pen"></i> Rename</button>
          <button type="button" id="sb-download" title="Save this script as a .lvs file"><i class="fas fa-download"></i> Download</button>
          <button type="button" id="sb-delete" class="danger" title="Delete this script"><i class="fas fa-trash"></i> Delete</button>
        </div>
        <div class="sb-group" role="group" aria-label="Open as a new script">
          <span class="sb-label">open as new script</span>
          <select id="sb-sample" aria-label="Open a sample as a new script"><option value="">sample&hellip;</option></select>
          <label class="file-btn" title="Open a .lvs file from your computer as a new script"><i class="fas fa-folder-open"></i> File&hellip;<input type="file" id="sb-open" accept=".lvs,text/plain" hidden></label>
        </div>
        <span id="sb-note" role="status"></span>
      </div>
    </header>
    <main class="lab-main">
      <div id="sandbox" data-height="640" data-diag-under-editor></div>
      <section id="reference">
        <h2>Reference</h2>
        <input type="search" id="ref-q" placeholder="search: random, path, grow, ..." aria-label="Search the reference" autocomplete="off">
        <div class="layer-chips" id="ref-kinds"></div>
        <div id="ref-results"></div>
      </section>
    </main>
  </div>
  <script src="wasm/ls_wasm.js"></script>
  <script src="js/samples-data.js"></script>
  <script src="js/api-search.js"></script>
  <script src="js/editor-model.js"></script>
  <script src="js/cm-editor.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
