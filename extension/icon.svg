<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Background -->
  <rect width="128" height="128" rx="16" fill="#1e1e2e"/>

  <!-- Grid lines -->
  <g stroke="#3a3a5c" stroke-width="1">
    <line x1="20" y1="44" x2="108" y2="44"/>
    <line x1="20" y1="66" x2="108" y2="66"/>
    <line x1="20" y1="88" x2="108" y2="88"/>
    <line x1="42" y1="22" x2="42" y2="110"/>
    <line x1="64" y1="22" x2="64" y2="110"/>
    <line x1="86" y1="22" x2="86" y2="110"/>
  </g>

  <!-- Colored cells (tag values) — a pattern body snapshot -->
  <!-- Row 1 -->
  <rect x="21" y="23" width="20" height="20" rx="3" fill="#7c3d3d" opacity="0.85"/>
  <rect x="43" y="23" width="20" height="20" rx="3" fill="#3d5c7c" opacity="0.85"/>
  <rect x="65" y="23" width="20" height="20" rx="3" fill="#7c3d3d" opacity="0.85"/>
  <!-- Row 2 -->
  <rect x="43" y="45" width="20" height="20" rx="3" fill="#4a7c3d" opacity="0.85"/>
  <rect x="65" y="45" width="20" height="20" rx="3" fill="#4a7c3d" opacity="0.85"/>
  <rect x="87" y="45" width="20" height="20" rx="3" fill="#3d5c7c" opacity="0.85"/>
  <!-- Row 3 -->
  <rect x="21" y="67" width="20" height="20" rx="3" fill="#7c3d3d" opacity="0.85"/>
  <rect x="65" y="67" width="20" height="20" rx="3" fill="#4a7c3d" opacity="0.85"/>
  <rect x="87" y="67" width="20" height="20" rx="3" fill="#7c3d3d" opacity="0.85"/>
  <!-- Row 4 -->
  <rect x="43" y="89" width="20" height="20" rx="3" fill="#3d5c7c" opacity="0.85"/>
  <rect x="65" y="89" width="20" height="20" rx="3" fill="#7c3d3d" opacity="0.85"/>

  <!-- Outer grid border -->
  <rect x="20" y="22" width="88" height="88" rx="4" fill="none" stroke="#5a5a8a" stroke-width="1.5"/>
</svg>
